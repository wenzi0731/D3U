[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d3u-heew-baseline1"
version = "0.1.0"
description = "Condition-only D3U adaptation for HEEW joint source-load scenarios"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "torch>=2.1",
  "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
legacy = [
  "einops>=0.7",
  "scikit-learn>=1.3",
  "setproctitle>=1.3",
  "timm>=0.9",
]

[tool.setuptools.packages.find]
include = ["baseline1*", "model9_NS_transformer*", "layers*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
